<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Green Turkey Day Bar v5</title>
  <style>
    :root {
      --sky-1: #f4ffe8;
      --sky-2: #dff6c8;
      --field-1: #a9dd79;
      --field-2: #5dad55;
      --ink: #17351f;
      --muted: #55715a;
      --line: rgba(23, 53, 31, 0.12);
      --card: rgba(255, 255, 255, 0.78);
      --accent: #2f9e44;
      --accent-2: #1b7f3a;
      --bar-bg: #cfe9bd;
      --bar-fill: linear-gradient(90deg, #c8f169 0%, #8de05b 42%, #37b24d 100%);
      --shadow: 0 18px 50px rgba(30, 92, 43, 0.18);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 241, 133, .7), transparent 22%),
        radial-gradient(circle at 80% 8%, rgba(183, 238, 146, .55), transparent 32%),
        linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 52%, #c3eaa8 100%);
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(6px, 1.5vw, 16px);
    }

    .widget {
      width: min(100%, 1280px);
      aspect-ratio: 21 / 9;
      min-height: 276px;
      max-height: 100vh;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.66)),
        radial-gradient(circle at 12% 100%, rgba(102, 187, 106, .15), transparent 28%);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      position: relative;
      overflow: hidden;
      padding: clamp(13px, 1.5vw, 20px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(2px, .35vw, 6px);
    }

    .widget::before,
    .widget::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .widget::before {
      left: -8%;
      right: -8%;
      bottom: -38%;
      height: 58%;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, rgba(169, 221, 121, .42), rgba(87, 171, 83, .38));
    }

    .widget::after {
      width: 320px;
      height: 320px;
      right: -120px;
      top: -150px;
      border-radius: 999px;
      background: rgba(200, 241, 105, .18);
    }

    .top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .dateBlock h1 {
      margin: 0;
      font-size: clamp(34px, 4.35vw, 66px);
      letter-spacing: -0.055em;
      line-height: 1.02;
      color: #12391e;
    }

    .dateBlock p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: clamp(13px, 1.08vw, 17px);
      font-weight: 850;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 0;
      appearance: none;
      border-radius: 999px;
      padding: 10px 15px;
      color: #fff;
      background: linear-gradient(135deg, #2f9e44, #1b7f3a);
      font-weight: 900;
      font-size: clamp(12px, .96vw, 14px);
      cursor: pointer;
      box-shadow: 0 9px 22px rgba(35, 122, 57, .22);
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(35,122,57,.28); }
    .btn:active { transform: translateY(0); }
    .btn.secondary { background: rgba(23, 53, 31, .08); color: var(--ink); box-shadow: none; }
    .btn.danger { background: #b23b3b; }

    .main {
      position: relative;
      z-index: 2;
      display: grid;
      align-content: start;
      gap: 0;
      min-height: 0;
    }

    .progressMeta {
      display: none;
    }

    .nowBadge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(23,53,31,.08);
      font-size: clamp(11px, .92vw, 13px);
      color: var(--muted);
      font-weight: 900;
      white-space: nowrap;
    }

    .barWrap {
      position: relative;
      margin-top: clamp(4px, .55vw, 8px);
      padding-top: clamp(42px, 5.2vw, 64px);
      padding-bottom: 24px;
    }

    .turkeyTrack {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 62px;
      pointer-events: none;
      z-index: 4;
    }

    .turkeyGroup {
      --x: 0%;
      position: absolute;
      left: clamp(42px, var(--x), calc(100% - 230px));
      top: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transform: translateX(-18%);
      filter: drop-shadow(0 7px 9px rgba(41, 105, 47, .22));
      animation: runBob 1.18s ease-in-out infinite;
    }

    .bird {
      display: inline-block;
      font-size: clamp(27px, 3.1vw, 44px);
    }

    .speechBubble {
      position: relative;
      max-width: min(380px, 42vw);
      padding: 8px 12px;
      border-radius: 16px 16px 16px 5px;
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(23, 53, 31, .12);
      color: #17351f;
      font-size: clamp(11px, 1.05vw, 15px);
      font-weight: 950;
      letter-spacing: -0.03em;
      white-space: nowrap;
      box-shadow: 0 10px 22px rgba(35, 122, 57, .14);
    }

    .speechBubble::before {
      content: "";
      position: absolute;
      left: -7px;
      top: 16px;
      width: 12px;
      height: 12px;
      background: rgba(255,255,255,.94);
      border-left: 1px solid rgba(23, 53, 31, .12);
      border-bottom: 1px solid rgba(23, 53, 31, .12);
      transform: rotate(45deg);
    }

    @keyframes runBob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -5px; }
    }

    .bar {
      position: relative;
      height: clamp(38px, 5.3vw, 62px);
      border-radius: 999px;
      background:
        repeating-linear-gradient(100deg, rgba(255,255,255,.18) 0 7px, rgba(255,255,255,0) 7px 15px),
        var(--bar-bg);
      box-shadow: inset 0 2px 8px rgba(25,84,34,.12), 0 14px 30px rgba(45,117,50,.16);
      overflow: visible;
      border: 1px solid rgba(255,255,255,.78);
    }

    .bar::before {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: -7px;
      height: 16px;
      border-radius: 50%;
      background: repeating-linear-gradient(90deg, rgba(45, 150, 70, .38) 0 3px, transparent 3px 9px);
      filter: blur(.1px);
      opacity: .8;
      pointer-events: none;
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: var(--bar-fill);
      transition: width .8s ease;
      overflow: hidden;
    }

    .fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.38), transparent 45%, rgba(0,0,0,.04));
      pointer-events: none;
    }

    .segmentLayer, .markerLayer {
      position: absolute;
      inset: 0;
    }

    .segmentLayer { pointer-events: none; }
    .markerLayer { pointer-events: none; z-index: 5; }

    .segment {
      position: absolute;
      top: 7px;
      bottom: 7px;
      min-width: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .34);
      border: 1px solid rgba(255, 255, 255, .5);
      backdrop-filter: blur(2px);
    }

    .segment.active {
      background: rgba(23, 53, 31, .72);
      border-color: rgba(255,255,255,.62);
      box-shadow: 0 8px 18px rgba(23, 53, 31, .22);
      z-index: 2;
    }

    .eventDot {
      --dot-left: 0%;
      position: absolute;
      left: var(--dot-left);
      top: 50%;
      width: clamp(16px, 1.55vw, 22px);
      height: clamp(16px, 1.55vw, 22px);
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: rgba(255,255,255,.28);
      border: 2px solid rgba(255,255,255,.72);
      box-shadow: 0 5px 16px rgba(20, 90, 34, .18), inset 0 0 0 4px rgba(47,158,68,.18);
      pointer-events: auto;
      cursor: help;
      touch-action: manipulation;
    }

    .eventDot.active {
      background: rgba(255,255,255,.7);
      border-color: #fff;
      box-shadow: 0 7px 18px rgba(23, 53, 31, .25), inset 0 0 0 5px rgba(47,158,68,.35);
    }

    .eventDot::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 11px);
      transform: translateX(-50%) translateY(5px);
      width: max-content;
      max-width: 250px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(23, 53, 31, .94);
      color: #fff;
      font-size: 12px;
      font-weight: 850;
      line-height: 1.35;
      white-space: normal;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 20;
    }

    .eventDot::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 5px);
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(23, 53, 31, .94);
      opacity: 0;
      transition: opacity .16s ease;
      z-index: 20;
    }

    .eventDot:hover::after,
    .eventDot:hover::before,
    .eventDot:focus-visible::after,
    .eventDot:focus-visible::before {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .shine {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.26), transparent 50%);
      pointer-events: none;
      z-index: 3;
    }

    .timeMarks {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      color: rgba(23,53,31,.52);
      font-size: clamp(10px, .82vw, 13px);
      font-weight: 900;
    }

    .bottom {
      display: none;
    }

    .countdowns {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(23,53,31,.08);
      color: var(--ink);
      font-size: clamp(10px, .88vw, 13px);
      font-weight: 850;
      white-space: nowrap;
    }

    .chip strong { color: var(--accent-2); }

    .clock {
      color: rgba(23,53,31,.67);
      font-size: clamp(12px, .96vw, 15px);
      font-weight: 900;
      white-space: nowrap;
    }

    dialog {
      width: min(94vw, 890px);
      max-height: 88vh;
      border: 0;
      border-radius: 26px;
      padding: 0;
      box-shadow: 0 25px 80px rgba(0,0,0,.28);
      background: #fbfff5;
      color: var(--ink);
      overflow: hidden;
    }

    dialog::backdrop { background: rgba(16, 45, 21, .42); backdrop-filter: blur(4px); }

    .modalHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 21px 24px 15px;
      border-bottom: 1px solid var(--line);
    }

    .modalHead h2 { margin: 0; font-size: 22px; letter-spacing: -0.04em; }
    .modalHead p { margin: 5px 0 0; color: var(--muted); font-weight: 700; font-size: 13px; }

    .modalBody {
      padding: 19px 24px 24px;
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 20px;
      overflow: auto;
      max-height: calc(88vh - 84px);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.68);
      padding: 16px;
    }

    .panel h3 { margin: 0 0 12px; font-size: 15px; }

    .formGrid { display: grid; gap: 12px; }
    label { display: grid; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 850; }

    .switchRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 13px;
      border: 1px solid rgba(23,53,31,.12);
      border-radius: 16px;
      background: rgba(255,255,255,.72);
    }

    .switchText strong {
      display: block;
      font-size: 13px;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .switchText span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
    }

    .switch {
      position: relative;
      width: 54px;
      height: 30px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      inset: 0;
      cursor: pointer;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(23,53,31,.16);
      transition: background .18s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 3px;
      top: 3px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 5px 12px rgba(23,53,31,.18);
      transition: transform .18s ease;
    }

    .switch input:checked + .slider { background: linear-gradient(135deg, #2f9e44, #1b7f3a); }
    .switch input:checked + .slider::before { transform: translateX(24px); }

    input, select {
      width: 100%;
      border: 1px solid rgba(23,53,31,.17);
      border-radius: 13px;
      background: #fff;
      padding: 11px 12px;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,158,68,.14); }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .formHint { color: var(--muted); font-size: 12px; font-weight: 750; line-height: 1.45; }
    .formActions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

    .itemList { display: grid; gap: 8px; max-height: 440px; overflow: auto; padding-right: 4px; }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(23,53,31,.1);
      border-radius: 16px;
      background: #fff;
      padding: 11px 12px;
    }

    .item b { display: block; font-size: 13px; margin-bottom: 3px; }
    .item span { color: var(--muted); font-size: 12px; font-weight: 700; }
    .itemBtns { display: flex; gap: 6px; }
    .miniBtn {
      border: 0;
      border-radius: 999px;
      background: rgba(23,53,31,.08);
      color: var(--ink);
      padding: 7px 9px;
      font-weight: 900;
      font-size: 11px;
      cursor: pointer;
    }
    .miniBtn.del { background: rgba(178,59,59,.1); color: #b23b3b; }

    .hide { display: none !important; }

    @media (max-width: 740px) {
      body { overflow: auto; }
      .widget { min-height: 350px; aspect-ratio: auto; }
      .top, .bottom { align-items: flex-start; }
      .bottom { flex-direction: column; gap: 8px; }
      .modalBody { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; }
      .speechBubble { max-width: 240px; }
      .two { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="widget" aria-label="하루 일정 진행 표시 바">
    <section class="top">
      <div class="dateBlock">
        <h1 id="todayTitle">오늘은 - 입니다.</h1>
        <p id="todaySub">하루 진행률을 계산하는 중입니다.</p>
      </div>
      <div class="actions">
        <button class="btn" id="openModal">+ 일정 추가하기</button>
      </div>
    </section>

    <section class="main">
      <div class="progressMeta">
        <span class="nowBadge" id="progressBadge">0%</span>
      </div>

      <div class="barWrap">
        <div class="turkeyTrack">
          <div class="turkeyGroup" id="turkeyGroup" aria-hidden="true">
            <span class="bird">🦃</span>
            <span class="speechBubble" id="nowBubble">지금은 자유 학습 시간입니다.</span>
          </div>
        </div>
        <div class="bar">
          <div class="fill" id="fill"></div>
          <div class="segmentLayer" id="segmentLayer"></div>
          <div class="markerLayer" id="markerLayer"></div>
          <div class="shine"></div>
        </div>
        <div class="timeMarks" aria-hidden="true">
          <span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>
        </div>
      </div>
    </section>

    <section class="bottom" aria-hidden="true">
      <div class="countdowns" id="countdowns"></div>
      <div class="clock" id="clock">--:--:--</div>
    </section>
  </main>

  <dialog id="scheduleDialog">
    <div class="modalHead">
      <div>
        <h2>일정 추가 및 기본값 수정</h2>
        <p>저장한 내용은 현재 브라우저에 보관됩니다.</p>
      </div>
      <button class="btn secondary" id="closeModal">닫기</button>
    </div>
    <div class="modalBody">
      <section class="panel">
        <h3 id="formTitle">새 일정 추가</h3>
        <form class="formGrid" id="scheduleForm">
          <input type="hidden" id="editingId" />
          <p class="formHint" id="repeatHint">새 일정은 하루종일 여부, 시작/종료 시간, 반복 규칙으로 등록됩니다.</p>
          <label>
            일정 이름
            <input id="name" placeholder="예: 카피 특강" required />
          </label>
          <div class="switchRow">
            <div class="switchText">
              <strong>하루종일</strong>
              <span>켜면 해당 날짜의 00:00부터 23:59까지 표시돼요.</span>
            </div>
            <label class="switch" aria-label="하루종일 설정">
              <input id="allDay" type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>
          <div class="two">
            <label>
              시작 년월일 시간
              <input id="startDateTime" type="datetime-local" required />
            </label>
            <label>
              종료 년월일 시간
              <input id="endDateTime" type="datetime-local" required />
            </label>
          </div>
          <label>
            반복
            <select id="recurrence">
              <option value="once">반복 없음</option>
              <option value="daily">매일</option>
              <option value="weekly">매주</option>
            </select>
          </label>
          <div class="formActions">
            <button class="btn" type="submit" id="saveBtn">저장하기</button>
            <button class="btn secondary" type="button" id="clearForm">입력 초기화</button>
            <button class="btn danger" type="button" id="resetDefault">전체 기본값 복구</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h3>등록된 일정</h3>
        <div class="itemList" id="itemList"></div>
      </section>
    </div>
  </dialog>

  <script>
    const CONFIG_KEY = "notion-green-turkey-daybar-v2";
    const KST = "Asia/Seoul";

    const DEFAULT_ITEMS = [
      { id: "daily-scrum-am", recurrence: "daily", name: "오전 스크럼", start: "09:00", end: "10:00", category: "daily" },
      { id: "daily-lunch", recurrence: "daily", name: "점심", start: "13:00", end: "14:00", category: "daily" },
      { id: "daily-evening", recurrence: "daily", name: "오후", start: "18:00", end: "19:00", category: "daily" },
      { id: "daily-scrum-pm", recurrence: "daily", name: "오후 스크럼", start: "19:00", end: "20:00", category: "daily" },
      { id: "daily-til", recurrence: "daily", name: "TIL 작성", start: "20:00", end: "21:00", category: "study" },
      { id: "weekly-article", recurrence: "weekly", name: "아티클 스터디", days: [2, 4], start: "10:30", end: "11:30", category: "study" },
      { id: "holiday-buddha", recurrence: "once", name: "석가탄신일", startAt: "2026-05-25T00:00", endAt: "2026-05-25T23:59", category: "holiday" },
      { id: "holiday-election", recurrence: "once", name: "지방선거", startAt: "2026-06-03T00:00", endAt: "2026-06-03T23:59", category: "holiday" },
      { id: "session-career", recurrence: "once", name: "정은튜터님 커리어세션", startAt: "2026-05-22T19:30", endAt: "2026-05-22T20:30", category: "session" },
      { id: "session-copy", recurrence: "once", name: "카피 특강", startAt: "2026-05-26T15:00", endAt: "2026-05-26T16:00", category: "session" },
      { id: "session-image", recurrence: "once", name: "이미지 기획과 제작 세션", startAt: "2026-05-29T19:30", endAt: "2026-05-29T20:00", category: "session" },
      { id: "session-video-1", recurrence: "once", name: "영상제작 특강", startAt: "2026-06-01T11:00", endAt: "2026-06-01T12:00", category: "session" },
      { id: "session-video-2", recurrence: "once", name: "영상 제작 특강2", startAt: "2026-06-02T19:30", endAt: "2026-06-02T20:00", category: "session" },
      { id: "assignment-brief", recurrence: "once", name: "개인과제 발제", startAt: "2026-06-04T10:00", endAt: "2026-06-04T11:00", category: "assignment" },
      { id: "assignment-review", recurrence: "once", name: "개인과제 해설", startAt: "2026-06-11T11:00", endAt: "2026-06-11T12:00", category: "assignment" }
    ];

    const categoryEmoji = {
      daily: "🕘",
      study: "📚",
      session: "🎙️",
      assignment: "📝",
      holiday: "🎉",
      other: "📌"
    };

    const categoryLabel = {
      daily: "일상",
      study: "스터디",
      session: "세션/특강",
      assignment: "개인과제",
      holiday: "공휴일",
      other: "기타"
    };

    const el = {
      todayTitle: document.getElementById("todayTitle"),
      todaySub: document.getElementById("todaySub"),
      progressBadge: document.getElementById("progressBadge"),
      nowBubble: document.getElementById("nowBubble"),
      fill: document.getElementById("fill"),
      turkeyGroup: document.getElementById("turkeyGroup"),
      segmentLayer: document.getElementById("segmentLayer"),
      markerLayer: document.getElementById("markerLayer"),
      countdowns: document.getElementById("countdowns"),
      clock: document.getElementById("clock"),
      dialog: document.getElementById("scheduleDialog"),
      openModal: document.getElementById("openModal"),
      closeModal: document.getElementById("closeModal"),
      form: document.getElementById("scheduleForm"),
      formTitle: document.getElementById("formTitle"),
      repeatHint: document.getElementById("repeatHint"),
      editingId: document.getElementById("editingId"),
      name: document.getElementById("name"),
      startDateTime: document.getElementById("startDateTime"),
      endDateTime: document.getElementById("endDateTime"),
      allDay: document.getElementById("allDay"),
      recurrence: document.getElementById("recurrence"),
      itemList: document.getElementById("itemList"),
      clearForm: document.getElementById("clearForm"),
      resetDefault: document.getElementById("resetDefault"),
      saveBtn: document.getElementById("saveBtn")
    };

    let items = loadItems();
    let segmentRenderKey = "";

    function cloneDefaults() {
      return JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    }

    function loadItems() {
      try {
        const saved = localStorage.getItem(CONFIG_KEY);
        return saved ? JSON.parse(saved) : cloneDefaults();
      } catch (_) {
        return cloneDefaults();
      }
    }

    function saveItems() {
      localStorage.setItem(CONFIG_KEY, JSON.stringify(items));
    }

    function uid() {
      return crypto && crypto.randomUUID ? crypto.randomUUID() : `item-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function getKstParts(date = new Date()) {
      const parts = new Intl.DateTimeFormat("ko-KR", {
        timeZone: KST,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(date).reduce((acc, part) => {
        acc[part.type] = part.value;
        return acc;
      }, {});

      const year = Number(parts.year);
      const month = Number(parts.month);
      const day = Number(parts.day);
      const hour = Number(parts.hour === "24" ? "00" : parts.hour);
      const minute = Number(parts.minute);
      const second = Number(parts.second);
      const dateString = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const weekdayMap = { "일": 0, "월": 1, "화": 2, "수": 3, "목": 4, "금": 5, "토": 6 };
      return { year, month, day, hour, minute, second, dateString, weekday: weekdayMap[parts.weekday] ?? 0 };
    }

    function minutes(time) {
      const [h, m] = time.split(":").map(Number);
      return h * 60 + m;
    }

    function parseKstDateTime(value) {
      if (!value) return null;
      return new Date(`${value}:00+09:00`);
    }

    function datePart(value) {
      return value ? value.slice(0, 10) : "";
    }

    function timePart(value) {
      return value ? value.slice(11, 16) : "";
    }

    function weekdayFromDateValue(value) {
      const d = parseKstDateTime(`${datePart(value)}T00:00`);
      if (!d) return getKstParts().weekday;
      const weekday = new Intl.DateTimeFormat("ko-KR", { timeZone: KST, weekday: "short" }).format(d).replace("요일", "");
      const weekdayMap = { "일": 0, "월": 1, "화": 2, "수": 3, "목": 4, "금": 5, "토": 6 };
      return weekdayMap[weekday] ?? getKstParts().weekday;
    }

    function dateAtKst(dateString, time = "00:00") {
      return new Date(`${dateString}T${time}:00+09:00`);
    }

    function formatTimeRange(item) {
      const range = item.allDay ? "하루종일" : `${item.start || timePart(item.startAt)}-${item.end || timePart(item.endAt)}`;
      if (item.recurrence === "daily") return `매일 ${range}`;
      if (item.recurrence === "weekly") return `매주 ${(item.days || []).map(dayName).join("·")} ${range}`;
      const s = item.startAt ? item.startAt.replace("T", " ") : "";
      const e = item.endAt ? item.endAt.replace("T", " ") : "";
      return item.allDay ? `${datePart(item.startAt)} 하루종일` : `${s} ~ ${e}`;
    }

    function eventStartDate(item, parts = getKstParts()) {
      if (item.recurrence === "daily" || item.recurrence === "weekly") return dateAtKst(item.startDate || parts.dateString, item.allDay ? "00:00" : item.start);
      return parseKstDateTime(item.startAt);
    }

    function eventEndDate(item, parts = getKstParts()) {
      if (item.recurrence === "daily" || item.recurrence === "weekly") return dateAtKst(item.startDate || parts.dateString, item.allDay ? "23:59" : item.end);
      return parseKstDateTime(item.endAt);
    }

    function todayEvents(parts) {
      const dayStart = dateAtKst(parts.dateString, "00:00");
      const dayEnd = dateAtKst(parts.dateString, "23:59");

      return items.flatMap(item => {
        if (item.recurrence === "daily") {
          if (item.startDate && parts.dateString < item.startDate) return [];
          return [{ ...item, dayStart: item.allDay ? 0 : minutes(item.start), dayEnd: item.allDay ? 1440 : minutes(item.end) }];
        }

        if (item.recurrence === "weekly" && item.days && item.days.includes(parts.weekday)) {
          if (item.startDate && parts.dateString < item.startDate) return [];
          return [{ ...item, dayStart: item.allDay ? 0 : minutes(item.start), dayEnd: item.allDay ? 1440 : minutes(item.end) }];
        }

        if (item.recurrence === "once") {
          const start = parseKstDateTime(item.startAt);
          const end = parseKstDateTime(item.endAt);
          if (!start || !end || end < dayStart || start > dayEnd) return [];

          const startMin = Math.max(0, Math.floor((start - dayStart) / 60000));
          const endMin = Math.min(1440, Math.ceil((end - dayStart) / 60000));
          return [{ ...item, dayStart: startMin, dayEnd: Math.max(startMin + 1, endMin) }];
        }

        return [];
      }).sort((a, b) => a.dayStart - b.dayStart || eventWeight(b) - eventWeight(a));
    }

    function eventWeight(item) {
      if (item.category === "holiday") return 5;
      if (item.category === "assignment") return 4;
      if (item.category === "session") return 3;
      if (item.recurrence === "weekly") return 2;
      return 1;
    }

    function activeEvent(events, nowMinutes) {
      return events
        .filter(item => nowMinutes >= item.dayStart && nowMinutes < item.dayEnd)
        .sort((a, b) => eventWeight(b) - eventWeight(a))[0];
    }

    function render() {
      const now = new Date();
      const p = getKstParts(now);
      const nowMinutes = p.hour * 60 + p.minute + p.second / 60;
      const progress = Math.max(0, Math.min(100, (nowMinutes / 1440) * 100));
      const events = todayEvents(p);
      const active = activeEvent(events, nowMinutes);

      const timeText = `${String(p.hour).padStart(2, "0")}:${String(p.minute).padStart(2, "0")}:${String(p.second).padStart(2, "0")}`;
      el.todayTitle.textContent = `오늘은 ${p.year}년 ${p.month}월 ${p.day}일 입니다.`;
      el.todaySub.textContent = `${dayName(p.weekday)}요일 · 현재 ${timeText} · 하루 ${progress.toFixed(1)}% 진행 중`;
      el.clock.textContent = timeText;
      el.progressBadge.textContent = ``;
      el.fill.style.width = `${progress}%`;
      el.turkeyGroup.style.setProperty("--x", `${progress}%`);
      updateBubble(active, now);

      renderSegments(events, nowMinutes);
      renderCountdowns(now);
    }

    function renderSegments(events, nowMinutes) {
      const prepared = events.map(item => {
        const start = Math.max(0, item.dayStart);
        const end = Math.min(1440, item.dayEnd);
        const left = (start / 1440) * 100;
        const width = Math.max(.2, ((end - start) / 1440) * 100);
        const isActive = nowMinutes >= start && nowMinutes < end;
        const categoryName = getCategoryName(item);
        const tip = `${item.name}\n${timeTextFromMinutes(start)}-${timeTextFromMinutes(end)}`;
        return { item, start, end, left, width, isActive, tip, categoryName };
      });

      const nextKey = prepared
        .map(({ item, start, end, isActive, categoryName }) => `${item.id}:${item.name}:${categoryName}:${start}:${end}:${isActive ? 1 : 0}`)
        .join("|");

      // 마우스를 올렸을 때 깜빡이던 이유는 1초마다 점 DOM을 새로 그렸기 때문입니다.
      // 일정 구성이나 활성 상태가 바뀔 때만 다시 그려서 tooltip hover를 안정화합니다.
      if (nextKey === segmentRenderKey) return;
      segmentRenderKey = nextKey;

      el.segmentLayer.innerHTML = "";
      el.markerLayer.innerHTML = "";

      prepared.forEach(({ start, end, left, width, isActive, tip }) => {
        const seg = document.createElement("div");
        seg.className = "segment" + (isActive ? " active" : "");
        seg.style.left = `${left}%`;
        seg.style.width = `${width}%`;
        el.segmentLayer.appendChild(seg);

        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "eventDot" + (isActive ? " active" : "");
        dot.style.setProperty("--dot-left", `${Math.min(99, Math.max(1, left + width / 2))}%`);
        dot.setAttribute("aria-label", tip);
        dot.setAttribute("data-tip", tip);
        el.markerLayer.appendChild(dot);
      });
    }

    function updateBubble(active, now) {
      const messages = [];
      messages.push(active ? `지금은 ${active.name} 시간입니다.` : "지금은 자유 학습 시간입니다.");

      const upcoming = nextImportantEvent(now);
      if (upcoming) {
        messages.push(`${upcoming.item.name}까지 ${remainingText(upcoming.start - now)}!`);
      }

      // 말풍선은 5초마다 자연스럽게 바뀝니다.
      const index = Math.floor(Date.now() / 5000) % messages.length;
      el.nowBubble.textContent = messages[index];
    }

    function nextImportantEvent(now) {
      return items
        .filter(item => ["holiday", "session", "assignment"].includes(item.category))
        .map(item => ({ item, start: eventStartDate(item), end: eventEndDate(item) }))
        .filter(({ start, end }) => start && end && end >= now)
        .sort((a, b) => a.start - b.start)[0];
    }

    function renderCountdowns(now) {
      const upcoming = items
        .filter(item => ["holiday", "session", "assignment"].includes(item.category))
        .map(item => ({ item, start: eventStartDate(item), end: eventEndDate(item) }))
        .filter(({ start, end }) => start && end && end >= now)
        .sort((a, b) => a.start - b.start)
        .slice(0, 4);

      el.countdowns.innerHTML = "";
      if (!upcoming.length) {
        el.countdowns.innerHTML = `<span class="chip">✅ 등록된 공휴일·세션·개인과제가 모두 지났어요</span>`;
        return;
      }

      upcoming.forEach(({ item, start, end }) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        const state = now >= start && now <= end ? "진행 중" : remainingText(start - now);
        chip.innerHTML = `${categoryEmoji[item.category] || "📌"} <strong>${item.name}</strong> ${state}`;
        el.countdowns.appendChild(chip);
      });
    }

    function remainingText(ms) {
      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;
      if (ms <= 0) return "곧 시작";
      if (ms < hour) return `${Math.ceil(ms / minute)}분 남음`;
      if (ms < day) {
        const h = Math.floor(ms / hour);
        const m = Math.floor((ms % hour) / minute);
        return m ? `${h}시간 ${m}분 남음` : `${h}시간 남음`;
      }
      return `${Math.ceil(ms / day)}일 남음`;
    }

    function dayName(n) {
      return ["일", "월", "화", "수", "목", "금", "토"][n];
    }

    function timeTextFromMinutes(value) {
      const safe = Math.max(0, Math.min(1440, Math.round(value)));
      if (safe >= 1440) return "24:00";
      const h = Math.floor(safe / 60);
      const m = safe % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function getCategoryName(item) {
      if (item.category === "other") return item.categoryName || "기타";
      return categoryLabel[item.category] || "기타";
    }

    function describeItem(item) {
      return formatTimeRange(item);
    }

    function renderItemList() {
      const order = { holiday: 0, session: 1, assignment: 2, study: 3, daily: 4, other: 5 };
      const sorted = [...items].sort((a, b) => {
        const ca = order[a.category] ?? 9;
        const cb = order[b.category] ?? 9;
        if (ca !== cb) return ca - cb;
        return describeItem(a).localeCompare(describeItem(b), "ko");
      });

      el.itemList.innerHTML = "";
      sorted.forEach(item => {
        const node = document.createElement("div");
        node.className = "item";
        node.innerHTML = `
          <div>
            <b>${item.name}</b>
            <span>${describeItem(item)}</span>
          </div>
          <div class="itemBtns">
            <button class="miniBtn" data-edit="${item.id}">수정</button>
            <button class="miniBtn del" data-delete="${item.id}">삭제</button>
          </div>
        `;
        el.itemList.appendChild(node);
      });
    }

    function applyAllDayToInputs() {
      if (!el.allDay.checked) return;
      if (el.startDateTime.value) el.startDateTime.value = `${datePart(el.startDateTime.value)}T00:00`;
      if (el.endDateTime.value) el.endDateTime.value = `${datePart(el.endDateTime.value)}T23:59`;
    }

    function updateRepeatHint() {
      const selected = el.recurrence.value;
      if (selected === "daily") {
        el.repeatHint.textContent = "매일 반복됩니다. 시작/종료 시간은 하루 일정에 표시될 시간을 의미해요.";
      } else if (selected === "weekly") {
        const day = el.startDateTime.value ? dayName(weekdayFromDateValue(el.startDateTime.value)) : "선택한";
        el.repeatHint.textContent = `매주 ${day}요일마다 반복됩니다. 시작 날짜의 요일을 기준으로 잡아요.`;
      } else {
        el.repeatHint.textContent = "반복 없이 시작/종료 날짜와 시간으로 한 번만 등록됩니다.";
      }
    }

    function setDefaultDateTimes() {
      const p = getKstParts();
      if (!el.startDateTime.value) el.startDateTime.value = `${p.dateString}T09:00`;
      if (!el.endDateTime.value) el.endDateTime.value = `${p.dateString}T10:00`;
    }

    function clearForm() {
      el.form.reset();
      el.editingId.value = "";
      el.formTitle.textContent = "새 일정 추가";
      el.saveBtn.textContent = "저장하기";
      el.allDay.checked = false;
      el.recurrence.value = "once";
      setDefaultDateTimes();
      updateRepeatHint();
    }

    function fillForm(item) {
      const p = getKstParts();
      el.editingId.value = item.id;
      el.name.value = item.name;
      el.allDay.checked = !!item.allDay;
      el.recurrence.value = item.recurrence || "once";

      if (item.recurrence === "daily" || item.recurrence === "weekly") {
        const baseDate = item.startDate || p.dateString;
        el.startDateTime.value = `${baseDate}T${item.allDay ? "00:00" : item.start}`;
        el.endDateTime.value = `${baseDate}T${item.allDay ? "23:59" : item.end}`;
      } else {
        el.startDateTime.value = item.startAt || "";
        el.endDateTime.value = item.endAt || "";
      }

      el.formTitle.textContent = "일정 수정";
      el.saveBtn.textContent = "수정 저장";
      updateRepeatHint();
    }

    el.openModal.addEventListener("click", () => {
      renderItemList();
      if (!el.editingId.value) setDefaultDateTimes();
      el.dialog.showModal();
    });

    el.closeModal.addEventListener("click", () => el.dialog.close());
    el.clearForm.addEventListener("click", clearForm);
    el.allDay.addEventListener("change", () => { applyAllDayToInputs(); updateRepeatHint(); });
    el.startDateTime.addEventListener("change", () => { applyAllDayToInputs(); updateRepeatHint(); });
    el.endDateTime.addEventListener("change", applyAllDayToInputs);
    el.recurrence.addEventListener("change", updateRepeatHint);

    el.resetDefault.addEventListener("click", () => {
      if (!confirm("현재 브라우저에 저장된 일정을 지우고 처음 기본값으로 복구할까요?")) return;
      items = cloneDefaults();
      saveItems();
      clearForm();
      renderItemList();
      render();
    });

    el.form.addEventListener("submit", (e) => {
      e.preventDefault();
      const existing = items.find(saved => saved.id === el.editingId.value);
      const startValue = el.startDateTime.value;
      const endValue = el.endDateTime.value;
      const normalizedStart = el.allDay.checked ? `${datePart(startValue)}T00:00` : startValue;
      const normalizedEnd = el.allDay.checked ? `${datePart(endValue)}T23:59` : endValue;
      const startDate = parseKstDateTime(normalizedStart);
      const endDate = parseKstDateTime(normalizedEnd);

      if (!el.name.value.trim()) return alert("일정 이름을 입력해주세요.");
      if (!startValue || !endValue) return alert("시작 년월일 시간과 종료 년월일 시간을 입력해주세요.");
      if (!startDate || !endDate || startDate >= endDate) return alert("종료 년월일 시간은 시작보다 늦어야 합니다.");
      const repeat = el.recurrence.value;
      const base = {
        id: el.editingId.value || uid(),
        name: el.name.value.trim(),
        category: existing?.category || "other",
        categoryName: "",
        allDay: el.allDay.checked
      };

      let item;
      if (repeat === "daily") {
        item = {
          ...base,
          recurrence: "daily",
          startDate: datePart(normalizedStart),
          start: timePart(normalizedStart),
          end: timePart(normalizedEnd)
        };
      } else if (repeat === "weekly") {
        item = {
          ...base,
          recurrence: "weekly",
          startDate: datePart(normalizedStart),
          days: [weekdayFromDateValue(normalizedStart)],
          start: timePart(normalizedStart),
          end: timePart(normalizedEnd)
        };
      } else {
        item = {
          ...base,
          recurrence: "once",
          startAt: normalizedStart,
          endAt: normalizedEnd
        };
      }

      const idx = items.findIndex(saved => saved.id === item.id);
      if (idx >= 0) items[idx] = item;
      else items.push(item);

      saveItems();
      clearForm();
      renderItemList();
      render();
    });

    el.itemList.addEventListener("click", (e) => {
      const editId = e.target.dataset.edit;
      const deleteId = e.target.dataset.delete;
      if (editId) {
        const item = items.find(x => x.id === editId);
        if (item) fillForm(item);
      }
      if (deleteId) {
        const item = items.find(x => x.id === deleteId);
        if (!item) return;
        if (!confirm(`'${item.name}' 일정을 삭제할까요?`)) return;
        items = items.filter(x => x.id !== deleteId);
        saveItems();
        renderItemList();
        render();
      }
    });

    clearForm();
    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
