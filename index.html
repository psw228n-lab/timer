<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Green Turkey Gantt v12</title>
  <style>
    :root {
      --sky-1: #f4ffe8;
      --sky-2: #dff6c8;
      --field-1: #a9dd79;
      --field-2: #5dad55;
      --ink: #17351f;
      --muted: #55715a;
      --line: rgba(23, 53, 31, 0.12);
      --card: rgba(255, 255, 255, 0.78);
      --accent: #2f9e44;
      --accent-2: #1b7f3a;
      --bar-bg: #cfe9bd;
      --bar-fill: linear-gradient(90deg, #c8f169 0%, #8de05b 42%, #37b24d 100%);
      --shadow: 0 18px 50px rgba(30, 92, 43, 0.18);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --name-col: clamp(78px, 9.4vw, 112px);
      --gantt-gap: 8px;
      --gantt-pad: clamp(7px, .8vw, 11px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 241, 133, .7), transparent 22%),
        radial-gradient(circle at 80% 8%, rgba(183, 238, 146, .55), transparent 32%),
        linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 52%, #c3eaa8 100%);
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(6px, 1.5vw, 16px);
    }

    .widget {
      width: min(100%, 1280px);
      aspect-ratio: 21 / 9;
      min-height: 276px;
      max-height: 100vh;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.66)),
        radial-gradient(circle at 12% 100%, rgba(102, 187, 106, .15), transparent 28%);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      position: relative;
      overflow: hidden;
      padding: clamp(13px, 1.5vw, 20px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(2px, .35vw, 6px);
    }

    .widget::before,
    .widget::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .widget::before {
      left: -8%;
      right: -8%;
      bottom: -38%;
      height: 58%;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, rgba(169, 221, 121, .42), rgba(87, 171, 83, .38));
    }

    .widget::after {
      width: 320px;
      height: 320px;
      right: -120px;
      top: -150px;
      border-radius: 999px;
      background: rgba(200, 241, 105, .18);
    }

    .top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .dateBlock h1 {
      margin: 0;
      font-size: clamp(34px, 4.35vw, 66px);
      letter-spacing: -0.055em;
      line-height: 1.02;
      color: #12391e;
    }

    .dateBlock p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: clamp(13px, 1.08vw, 17px);
      font-weight: 850;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 0;
      appearance: none;
      border-radius: 999px;
      padding: 10px 15px;
      color: #fff;
      background: linear-gradient(135deg, #2f9e44, #1b7f3a);
      font-weight: 900;
      font-size: clamp(12px, .96vw, 14px);
      cursor: pointer;
      box-shadow: 0 9px 22px rgba(35, 122, 57, .22);
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(35,122,57,.28); }
    .btn:active { transform: translateY(0); }
    .btn.secondary { background: rgba(23, 53, 31, .08); color: var(--ink); box-shadow: none; }
    .btn.danger { background: #b23b3b; }

    .main {
      position: relative;
      z-index: 2;
      display: grid;
      align-content: start;
      gap: 0;
      min-height: 0;
    }

    .progressMeta {
      display: none;
    }

    .nowBadge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(23,53,31,.08);
      font-size: clamp(11px, .92vw, 13px);
      color: var(--muted);
      font-weight: 900;
      white-space: nowrap;
    }

    .barWrap {
      position: relative;
      margin-top: 0;
      padding-top: clamp(38px, 4.4vw, 54px);
      padding-bottom: 0;
      min-height: 0;
    }

    .mainGanttCard {
      position: relative;
      border: 1px solid rgba(23,53,31,.1);
      border-radius: 22px;
      background: rgba(255,255,255,.62);
      padding: var(--gantt-pad);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 12px 28px rgba(45,117,50,.11);
      overflow: hidden;
    }

    .mainGanttCard::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34%;
      background: linear-gradient(180deg, transparent, rgba(141,224,91,.12));
      pointer-events: none;
    }

    .mainGanttAxis {
      position: relative;
      display: grid;
      grid-template-columns: var(--name-col) 1fr;
      gap: var(--gantt-gap);
      margin-bottom: 5px;
      color: rgba(23,53,31,.56);
      font-size: clamp(10px, .8vw, 12px);
      font-weight: 950;
      z-index: 1;
    }

    .mainGanttRows {
      position: relative;
      display: grid;
      gap: clamp(3px, .4vw, 5px);
      overflow: visible;
      padding-right: 0;
      z-index: 1;
    }

    .mainGanttRow {
      display: grid;
      grid-template-columns: var(--name-col) 1fr;
      gap: var(--gantt-gap);
      align-items: center;
    }

    .mainGanttName {
      min-width: 0;
    }

    .mainGanttName b {
      display: block;
      font-size: clamp(9px, .78vw, 12px);
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mainGanttName span {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: clamp(8px, .68vw, 10px);
      font-weight: 850;
      white-space: nowrap;
    }

    .mainGanttTrack {
      position: relative;
      height: clamp(19px, 2.05vw, 26px);
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, rgba(23,53,31,.055) 0 1px, transparent 1px 25%),
        rgba(207, 233, 189, .72);
      overflow: visible;
      border: 1px solid rgba(23,53,31,.08);
    }

    .mainGanttBar {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: var(--g-left);
      width: var(--g-width);
      min-width: 6px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #a3e635, #37b24d);
      box-shadow: 0 6px 12px rgba(35,122,57,.15);
      cursor: help;
      z-index: 2;
    }

    .mainGanttBar.active {
      background: linear-gradient(90deg, #5cdb5f, #1f8f43);
      box-shadow: 0 8px 18px rgba(23,53,31,.2);
    }

    .mainGanttBar::after,
    .mainGanttBar::before {
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 30;
    }

    .mainGanttBar::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translateX(-50%) translateY(5px);
      width: max-content;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(23, 53, 31, .94);
      color: #fff;
      font-size: 12px;
      font-weight: 850;
      line-height: 1.35;
      white-space: normal;
    }

    .mainGanttBar::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 4px);
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(23, 53, 31, .94);
    }

    .mainGanttBar:hover::after,
    .mainGanttBar:hover::before,
    .mainGanttBar:focus-visible::after,
    .mainGanttBar:focus-visible::before {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .turkeyTrack {
      position: absolute;
      left: calc(var(--gantt-pad) + var(--name-col) + var(--gantt-gap));
      right: var(--gantt-pad);
      top: 0;
      height: 58px;
      pointer-events: none;
      z-index: 4;
    }

    .turkeyGroup {
      --x: 0%;
      position: absolute;
      left: clamp(0px, var(--x), 100%);
      top: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transform: translateX(0);
      filter: drop-shadow(0 7px 9px rgba(41, 105, 47, .22));
      animation: runBob 1.18s ease-in-out infinite;
    }

    .bird {
      display: inline-block;
      font-size: clamp(27px, 3.1vw, 44px);
      transform: translateX(-50%);
      line-height: 1;
    }

    .speechBubble {
      position: relative;
      max-width: min(360px, 42vw);
      margin-left: -10px;
      padding: 8px 12px;
      border-radius: 16px 16px 16px 5px;
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(23, 53, 31, .12);
      color: #17351f;
      font-size: clamp(11px, 1.05vw, 15px);
      font-weight: 950;
      letter-spacing: -0.03em;
      white-space: nowrap;
      box-shadow: 0 10px 22px rgba(35, 122, 57, .14);
    }

    .speechBubble::before {
      content: "";
      position: absolute;
      left: -7px;
      top: 16px;
      width: 12px;
      height: 12px;
      background: rgba(255,255,255,.94);
      border-left: 1px solid rgba(23, 53, 31, .12);
      border-bottom: 1px solid rgba(23, 53, 31, .12);
      transform: rotate(45deg);
    }

    @keyframes runBob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -5px; }
    }

    .bar {
      position: relative;
      height: clamp(38px, 5.3vw, 62px);
      border-radius: 999px;
      background:
        repeating-linear-gradient(100deg, rgba(255,255,255,.18) 0 7px, rgba(255,255,255,0) 7px 15px),
        var(--bar-bg);
      box-shadow: inset 0 2px 8px rgba(25,84,34,.12), 0 14px 30px rgba(45,117,50,.16);
      overflow: visible;
      border: 1px solid rgba(255,255,255,.78);
    }

    .bar::before {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: -7px;
      height: 16px;
      border-radius: 50%;
      background: repeating-linear-gradient(90deg, rgba(45, 150, 70, .38) 0 3px, transparent 3px 9px);
      filter: blur(.1px);
      opacity: .8;
      pointer-events: none;
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: var(--bar-fill);
      transition: width .8s ease;
      overflow: hidden;
    }

    .fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.38), transparent 45%, rgba(0,0,0,.04));
      pointer-events: none;
    }

    .segmentLayer, .markerLayer {
      position: absolute;
      inset: 0;
    }

    .segmentLayer { pointer-events: none; }
    .markerLayer { pointer-events: none; z-index: 5; }

    .segment {
      position: absolute;
      top: 7px;
      bottom: 7px;
      min-width: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .34);
      border: 1px solid rgba(255, 255, 255, .5);
      backdrop-filter: blur(2px);
    }

    .segment.active {
      background: rgba(23, 53, 31, .72);
      border-color: rgba(255,255,255,.62);
      box-shadow: 0 8px 18px rgba(23, 53, 31, .22);
      z-index: 2;
    }

    .eventDot {
      --dot-left: 0%;
      position: absolute;
      left: var(--dot-left);
      top: 50%;
      width: clamp(17px, 1.65vw, 24px);
      height: clamp(17px, 1.65vw, 24px);
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: rgba(255,255,255,.34);
      border: 2px solid rgba(255,255,255,.82);
      box-shadow: 0 6px 18px rgba(20, 90, 34, .2), inset 0 0 0 5px rgba(47,158,68,.24);
      pointer-events: auto;
      cursor: help;
      touch-action: manipulation;
    }

    .eventDot.active {
      background: rgba(255,255,255,.78);
      border-color: #fff;
      box-shadow: 0 8px 22px rgba(23, 53, 31, .26), inset 0 0 0 6px rgba(47,158,68,.38);
    }

    .eventDot::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 11px);
      transform: translateX(-50%) translateY(5px);
      width: max-content;
      max-width: 250px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(23, 53, 31, .94);
      color: #fff;
      font-size: 12px;
      font-weight: 850;
      line-height: 1.35;
      white-space: normal;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 20;
    }

    .eventDot::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 5px);
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(23, 53, 31, .94);
      opacity: 0;
      transition: opacity .16s ease;
      z-index: 20;
    }

    .eventDot:hover::after,
    .eventDot:hover::before,
    .eventDot:focus-visible::after,
    .eventDot:focus-visible::before {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .shine {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.26), transparent 50%);
      pointer-events: none;
      z-index: 3;
    }

    .timeMarks {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      color: rgba(23,53,31,.52);
      font-size: clamp(10px, .82vw, 13px);
      font-weight: 900;
    }

    .bottom {
      display: none;
    }

    .countdowns {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(23,53,31,.08);
      color: var(--ink);
      font-size: clamp(10px, .88vw, 13px);
      font-weight: 850;
      white-space: nowrap;
    }

    .chip strong { color: var(--accent-2); }

    .clock {
      color: rgba(23,53,31,.67);
      font-size: clamp(12px, .96vw, 15px);
      font-weight: 900;
      white-space: nowrap;
    }

    .detailAction {
      display: none !important;
      position: absolute;
      right: clamp(13px, 1.6vw, 22px);
      bottom: clamp(11px, 1.35vw, 18px);
      z-index: 7;
      background: rgba(255,255,255,.72);
      color: var(--ink);
      border: 1px solid rgba(23,53,31,.1);
      box-shadow: 0 8px 22px rgba(35,122,57,.14);
    }

    .detailBody {
      padding: 18px 24px 24px;
      overflow: auto;
      max-height: calc(88vh - 84px);
    }

    .ganttCard {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.72);
      padding: 16px;
    }

    .ganttSummary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-weight: 850;
      font-size: 13px;
    }

    .ganttAxis {
      display: grid;
      grid-template-columns: 126px 1fr;
      gap: 12px;
      align-items: end;
      margin-bottom: 8px;
      color: rgba(23,53,31,.6);
      font-size: 12px;
      font-weight: 900;
    }

    .axisTrack {
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
    }

    .ganttRows {
      display: grid;
      gap: 9px;
    }

    .ganttRow {
      display: grid;
      grid-template-columns: 126px 1fr;
      gap: 12px;
      align-items: center;
    }

    .ganttName {
      min-width: 0;
    }

    .ganttName b {
      display: block;
      font-size: 13px;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ganttName span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .ganttTrack {
      position: relative;
      height: 34px;
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, rgba(23,53,31,.065) 0 1px, transparent 1px 25%),
        rgba(207, 233, 189, .72);
      overflow: visible;
      border: 1px solid rgba(23,53,31,.08);
    }

    .ganttBar {
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: var(--g-left);
      width: var(--g-width);
      min-width: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, #8de05b, #2f9e44);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 9px;
      font-size: 11px;
      font-weight: 950;
      white-space: nowrap;
      box-shadow: 0 7px 14px rgba(35,122,57,.18);
      z-index: 2;
      cursor: help;
    }

    .ganttBarText {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }

    .ganttBar.narrow .ganttBarText {
      display: none;
    }

    .ganttBar::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translateX(-50%) translateY(5px);
      width: max-content;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(23, 53, 31, .94);
      color: #fff;
      font-size: 12px;
      font-weight: 850;
      line-height: 1.35;
      white-space: normal;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 30;
    }

    .ganttBar::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 4px);
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(23, 53, 31, .94);
      opacity: 0;
      transition: opacity .16s ease;
      z-index: 30;
    }

    .ganttBar:hover::after,
    .ganttBar:hover::before,
    .ganttBar:focus-visible::after,
    .ganttBar:focus-visible::before {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .ganttNow {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--now-left);
      width: 2px;
      background: rgba(23,53,31,.16);
      box-shadow: 0 0 0 3px rgba(255,255,255,.24);
      z-index: 4;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .emptyGantt {
      grid-column: 1 / -1;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-weight: 850;
      border-radius: 18px;
      background: rgba(255,255,255,.6);
    }

    dialog {
      width: min(94vw, 890px);
      max-height: 88vh;
      border: 0;
      border-radius: 26px;
      padding: 0;
      box-shadow: 0 25px 80px rgba(0,0,0,.28);
      background: #fbfff5;
      color: var(--ink);
      overflow: hidden;
    }

    dialog::backdrop { background: rgba(16, 45, 21, .42); backdrop-filter: blur(4px); }

    .modalHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 21px 24px 15px;
      border-bottom: 1px solid var(--line);
    }

    .modalHead h2 { margin: 0; font-size: 22px; letter-spacing: -0.04em; }
    .modalHead p { margin: 5px 0 0; color: var(--muted); font-weight: 700; font-size: 13px; }

    .modalBody {
      padding: 19px 24px 24px;
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 20px;
      overflow: auto;
      max-height: calc(88vh - 84px);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.68);
      padding: 16px;
    }

    .panel h3 { margin: 0 0 12px; font-size: 15px; }

    .formGrid { display: grid; gap: 12px; }
    label { display: grid; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 850; }

    .switchRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 13px;
      border: 1px solid rgba(23,53,31,.12);
      border-radius: 16px;

      position: absolute;

      content: "";

      height: 24px;
      left: 3px;
      top: 3px;

      background: #fff;

    input, select {
      width: 100%;

    .itemList { display: grid; gap: 8px; max-height: 440px; overflow: auto; padding-right: 4px; }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(23,53,31,.1);
      border-radius: 16px;
      background: #fff;
      padding: 11px 12px;

    .item b { display: block; font-size: 13px; margin-bottom: 3px; }
    .item span { color: var(--muted); font-size: 12px; font-weight: 700; }
    .itemBtns { display: flex; gap: 6px; }
    .miniBtn {
      border: 0;
      border-radius: 999px;
      background: rgba(23,53,31,.08);
      color: var(--ink);
      padding: 7px 9px;
      font-weight: 900;
      font-size: 11px;
      cursor: pointer;
    }
    .miniBtn.del { background: rgba(178,59,59,.1); color: #b23b3b; }

    .weeklyDays {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .dayButtons {
      display: grid;
      grid-template-columns: repeat(7, 1fr);

    .dayButtons label {
      display: block;
      cursor: pointer;
    }

    .dayButtons input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .dayButtons span {
      display: grid;
      place-items: center;
      height: 36px;
      border-radius: 999px;
      background: rgba(23,53,31,.07);
      border: 1px solid rgba(23,53,31,.09);
      color: var(--ink);
      font-size: 12px;
      font-weight: 950;
      transition: transform .16s ease, background .16s ease, color .16s ease;

    .dayButtons input:checked + span {
      background: linear-gradient(135deg, #2f9e44, #1b7f3a);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 7px 16px rgba(35,122,57,.16);
    }

    .dayButtons label:hover span { transform: translateY(-1px); }

    .hide { display: none !important; }

    @media (max-width: 740px) {
      body { overflow: auto; }
      .widget { min-height: 350px; aspect-ratio: auto; }
      .top, .bottom { align-items: flex-start; }
      .bottom { flex-direction: column; gap: 8px; }

  <script>
    const CONFIG_KEY = "notion-green-turkey-daybar-v2";
    const KST = "Asia/Seoul";
    const CAMP_START_DATE = "2026-04-22";
    const HOLIDAY_DATES = ["2026-05-25", "2026-06-03"];

    const DEFAULT_ITEMS = [
      { id: "daily-scrum-am", recurrence: "daily", name: "오전 스크럼", start: "09:00", end: "10:00", category: "daily" },
      { id: "daily-lunch", recurrence: "daily", name: "점심", start: "13:00", end: "14:00", category: "daily" },
      { id: "daily-evening", recurrence: "daily", name: "오후", start: "18:00", end: "19:00", category: "daily" },
      { id: "daily-scrum-pm", recurrence: "daily", name: "오후 스크럼", start: "19:00", end: "20:00", category: "daily" },
      { id: "daily-til", recurrence: "daily", name: "TIL 작성", start: "20:00", end: "21:00", category: "study" },
      { id: "weekly-article", recurrence: "weekly", name: "아티클 스터디", days: [2, 4], start: "10:30", end: "11:30", category: "study" },
      { id: "holiday-buddha", recurrence: "once", name: "석가탄신일", startAt: "2026-05-25T00:00", endAt: "2026-05-25T23:59", category: "holiday" },
      { id: "holiday-election", recurrence: "once", name: "지방선거", startAt: "2026-06-03T00:00", endAt: "2026-06-03T23:59", category: "holiday" },
      { id: "session-career", recurrence: "once", name: "정은튜터님 커리어세션", startAt: "2026-05-22T19:30", endAt: "2026-05-22T20:30", category: "session" },
      { id: "session-copy", recurrence: "once", name: "카피 특강", startAt: "2026-05-26T15:00", endAt: "2026-05-26T16:00", category: "session" },
      { id: "session-image", recurrence: "once", name: "이미지 기획과 제작 세션", startAt: "2026-05-29T19:30", endAt: "2026-05-29T20:00", category: "session" },
      { id: "session-video-1", recurrence: "once", name: "영상제작 특강", startAt: "2026-06-01T11:00", endAt: "2026-06-01T12:00", category: "session" },
      { id: "session-video-2", recurrence: "once", name: "영상 제작 특강2", startAt: "2026-06-02T19:30", endAt: "2026-06-02T20:00", category: "session" },
      { id: "assignment-brief", recurrence: "once", name: "개인과제 발제", startAt: "2026-06-04T10:00", endAt: "2026-06-04T11:00", category: "assignment" },
      { id: "assignment-review", recurrence: "once", name: "개인과제 해설", startAt: "2026-06-11T11:00", endAt: "2026-06-11T12:00", category: "assignment" }
    ];

    const categoryEmoji = {
      daily: "🕘",
      study: "📚",
      session: "🎙️",
      assignment: "📝",
      holiday: "🎉",
      other: "📌"
    };

    const categoryLabel = {
      daily: "일상",
      study: "스터디",
      session: "세션/특강",
      assignment: "개인과제",
      holiday: "공휴일",
      other: "기타"
    };

    const el = {
      todayTitle: document.getElementById("todayTitle"),
      todaySub: document.getElementById("todaySub"),
      progressBadge: document.getElementById("progressBadge"),
      nowBubble: document.getElementById("nowBubble"),
      turkeyGroup: document.getElementById("turkeyGroup"),
      mainGanttRows: document.getElementById("mainGanttRows"),
      countdowns: document.getElementById("countdowns"),
      clock: document.getElementById("clock"),
      dialog: document.getElementById("scheduleDialog"),
      openModal: document.getElementById("openModal"),
      closeModal: document.getElementById("closeModal"),
      form: document.getElementById("scheduleForm"),
      formTitle: document.getElementById("formTitle"),
      repeatHint: document.getElementById("repeatHint"),
      editingId: document.getElementById("editingId"),
      name: document.getElementById("name"),
      startDateTime: document.getElementById("startDateTime"),
      endDateTime: document.getElementById("endDateTime"),
      allDay: document.getElementById("allDay"),
      recurrence: document.getElementById("recurrence"),
      weeklyDaysField: document.getElementById("weeklyDaysField"),
      weekdayButtons: document.getElementById("weekdayButtons"),
      itemList: document.getElementById("itemList"),
      clearForm: document.getElementById("clearForm"),
      resetDefault: document.getElementById("resetDefault"),
      saveBtn: document.getElementById("saveBtn"),
      detailDialog: document.getElementById("detailDialog"),
      openDetails: document.getElementById("openDetails"),
      closeDetails: document.getElementById("closeDetails"),
      detailSub: document.getElementById("detailSub"),
      ganttSummary: document.getElementById("ganttSummary"),
      ganttRows: document.getElementById("ganttRows")
    };

    let items = loadItems();
    let segmentRenderKey = "";
    let mainGanttRenderKey = "";

    function cloneDefaults() {
      return JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    }

    function loadItems() {
      try {
        const saved = localStorage.getItem(CONFIG_KEY);
        return saved ? JSON.parse(saved) : cloneDefaults();
      } catch (_) {
        return cloneDefaults();
      }
    }

    function saveItems() {
      localStorage.setItem(CONFIG_KEY, JSON.stringify(items));
    }

    function uid() {
      return crypto && crypto.randomUUID ? crypto.randomUUID() : `item-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function getKstParts(date = new Date()) {
      const parts = new Intl.DateTimeFormat("ko-KR", {
        timeZone: KST,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(date).reduce((acc, part) => {
        acc[part.type] = part.value;
        return acc;
      }, {});

      const year = Number(parts.year);
      const month = Number(parts.month);
      const day = Number(parts.day);
      const hour = Number(parts.hour === "24" ? "00" : parts.hour);
      const minute = Number(parts.minute);
      const second = Number(parts.second);
      const dateString = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const weekdayMap = { "일": 0, "월": 1, "화": 2, "수": 3, "목": 4, "금": 5, "토": 6 };
      return { year, month, day, hour, minute, second, dateString, weekday: weekdayMap[parts.weekday] ?? 0 };
    }

    function minutes(time) {
      const [h, m] = time.split(":").map(Number);
      return h * 60 + m;
    }

    function parseKstDateTime(value) {
      if (!value) return null;
      return new Date(`${value}:00+09:00`);
    }

    function datePart(value) {
      return value ? value.slice(0, 10) : "";
    }

    function timePart(value) {
      return value ? value.slice(11, 16) : "";
    }

    function weekdayFromDateValue(value) {
      const d = parseKstDateTime(`${datePart(value)}T00:00`);
      if (!d) return getKstParts().weekday;
      const weekday = new Intl.DateTimeFormat("ko-KR", { timeZone: KST, weekday: "short" }).format(d).replace("요일", "");
      const weekdayMap = { "일": 0, "월": 1, "화": 2, "수": 3, "목": 4, "금": 5, "토": 6 };
      return weekdayMap[weekday] ?? getKstParts().weekday;
    }

    function dateAtKst(dateString, time = "00:00") {
      return new Date(`${dateString}T${time}:00+09:00`);
    }

    function formatTimeRange(item) {
      const range = item.allDay ? "하루종일" : `${item.start || timePart(item.startAt)}-${item.end || timePart(item.endAt)}`;
      if (item.recurrence === "daily") return `매일 ${range}`;
      if (item.recurrence === "weekly") return `매주 ${(item.days || []).map(dayName).join("·")} ${range}`;
      const s = item.startAt ? item.startAt.replace("T", " ") : "";
      const e = item.endAt ? item.endAt.replace("T", " ") : "";
      return item.allDay ? `${datePart(item.startAt)} 하루종일` : `${s} ~ ${e}`;
    }

    function eventStartDate(item, parts = getKstParts()) {
      if (item.recurrence === "daily" || item.recurrence === "weekly") return dateAtKst(item.startDate || parts.dateString, item.allDay ? "00:00" : item.start);
      return parseKstDateTime(item.startAt);
    }

    function eventEndDate(item, parts = getKstParts()) {
      if (item.recurrence === "daily" || item.recurrence === "weekly") return dateAtKst(item.startDate || parts.dateString, item.allDay ? "23:59" : item.end);
      return parseKstDateTime(item.endAt);
    }

    function todayEvents(parts) {
      const dayStart = dateAtKst(parts.dateString, "00:00");
      const dayEnd = dateAtKst(parts.dateString, "23:59");

      return items.flatMap(item => {
        if (item.recurrence === "daily") {
          if (item.startDate && parts.dateString < item.startDate) return [];
          return [{ ...item, dayStart: item.allDay ? 0 : minutes(item.start), dayEnd: item.allDay ? 1440 : minutes(item.end) }];
        }

        if (item.recurrence === "weekly" && item.days && item.days.includes(parts.weekday)) {
          if (item.startDate && parts.dateString < item.startDate) return [];
          return [{ ...item, dayStart: item.allDay ? 0 : minutes(item.start), dayEnd: item.allDay ? 1440 : minutes(item.end) }];
        }

        if (item.recurrence === "once") {
          const start = parseKstDateTime(item.startAt);
          const end = parseKstDateTime(item.endAt);
          if (!start || !end || end < dayStart || start > dayEnd) return [];

          const startMin = Math.max(0, Math.floor((start - dayStart) / 60000));
          const endMin = Math.min(1440, Math.ceil((end - dayStart) / 60000));
          return [{ ...item, dayStart: startMin, dayEnd: Math.max(startMin + 1, endMin) }];
        }

        return [];
      }).sort((a, b) => a.dayStart - b.dayStart || eventWeight(b) - eventWeight(a));
    }

    function eventWeight(item) {
      if (item.category === "holiday") return 5;
      if (item.category === "assignment") return 4;
      if (item.category === "session") return 3;
      if (item.recurrence === "weekly") return 2;
      return 1;
    }

    function activeEvent(events, nowMinutes) {
      return events
        .filter(item => nowMinutes >= item.dayStart && nowMinutes < item.dayEnd)
        .sort((a, b) => eventWeight(b) - eventWeight(a))[0];
    }

    function getHolidayDateSet() {
      const set = new Set(HOLIDAY_DATES);

      items.forEach(item => {
        if (item.category !== "holiday" || !item.startAt) return;
        const start = parseKstDateTime(item.startAt);
        const end = parseKstDateTime(item.endAt || item.startAt);
        if (!start || !end) return;

        let cursor = dateAtKst(datePart(item.startAt), "00:00");
        const last = dateAtKst(datePart(item.endAt || item.startAt), "00:00");
        while (cursor <= last) {
          set.add(getKstParts(cursor).dateString);
          cursor = new Date(cursor.getTime() + 86400000);
        }
      });

      return set;
    }

    function getCampDay(parts) {
      const start = dateAtKst(CAMP_START_DATE, "00:00");
      const current = dateAtKst(parts.dateString, "00:00");
      if (current < start) return 0;

      const holidays = getHolidayDateSet();
      let count = 0;
      let cursor = new Date(start.getTime());

      while (cursor <= current) {
        const cursorParts = getKstParts(cursor);
        const isWeekend = cursorParts.weekday === 0 || cursorParts.weekday === 6;
        const isHoliday = holidays.has(cursorParts.dateString);
        if (!isWeekend && !isHoliday) count += 1;
        cursor = new Date(cursor.getTime() + 86400000);
      }

      return Math.max(1, count);
    }

    function render() {
      const now = new Date();
      const p = getKstParts(now);
      const nowMinutes = p.hour * 60 + p.minute + p.second / 60;
      const progress = Math.max(0, Math.min(100, (nowMinutes / 1440) * 100));
      const events = todayEvents(p);
      const active = activeEvent(events, nowMinutes);

      const timeText = `${String(p.hour).padStart(2, "0")}:${String(p.minute).padStart(2, "0")}:${String(p.second).padStart(2, "0")}`;
      el.todayTitle.textContent = `오늘은 캠프 ${getCampDay(p)}일차 입니다.`;
      el.todaySub.textContent = `${dayName(p.weekday)}요일 · 현재 ${timeText} · 하루 중 ${progress.toFixed(1)}% 진행 중`;
      el.clock.textContent = timeText;
      el.progressBadge.textContent = ``;
      el.turkeyGroup.style.setProperty("--x", `${progress}%`);
      updateBubble(active, now);

      renderMainGantt(events, nowMinutes, progress);
      renderCountdowns(now);
      if (el.detailDialog.open) renderGantt();
    }


    function renderMainGantt(events, nowMinutes, nowLeft) {
      const prepared = events.map(item => {
        const start = Math.max(0, item.dayStart);
        const end = Math.min(1440, item.dayEnd);
        const left = (start / 1440) * 100;
        const width = Math.max(.7, ((end - start) / 1440) * 100);
        const isActive = nowMinutes >= start && nowMinutes < end;
        const tip = `${item.name}
${timeTextFromMinutes(start)}-${timeTextFromMinutes(end)}`;
        return { item, start, end, left, width, isActive, tip };
      });

      const nextKey = prepared
        .map(({ item, start, end, isActive }) => `${item.id}:${item.name}:${start}:${end}:${isActive ? 1 : 0}`)
        .join("|");

      el.mainGanttRows.querySelectorAll(".ganttNow").forEach(line => {
        line.style.setProperty("--now-left", `${nowLeft}%`);
      });

      if (nextKey === mainGanttRenderKey) return;
      mainGanttRenderKey = nextKey;
      el.mainGanttRows.innerHTML = "";

      if (!prepared.length) {
        el.mainGanttRows.innerHTML = `<div class="emptyGantt">오늘 표시할 일정이 없어요.</div>`;
        return;
      }

      prepared.forEach(({ item, start, end, left, width, isActive, tip }) => {
        const row = document.createElement("div");
        row.className = "mainGanttRow";
        row.innerHTML = `
          <div class="mainGanttName">
            <b>${escapeHtml(item.name)}</b>
            <span>${timeTextFromMinutes(start)}-${timeTextFromMinutes(end)}</span>
          </div>
          <div class="mainGanttTrack">
            <span class="ganttNow" style="--now-left:${nowLeft}%"></span>
            <button class="mainGanttBar${isActive ? " active" : ""}" type="button" style="--g-left:${left}%; --g-width:${width}%" title="${escapeHtml(tip)}" data-tip="${escapeHtml(tip)}"></button>
          </div>
        `;
        el.mainGanttRows.appendChild(row);
      });
    }

    function renderSegments(events, nowMinutes) {
      const prepared = events.map((item) => {
        const start = Math.max(0, item.dayStart);
        const end = Math.min(1440, item.dayEnd);
        const midLeft = ((start + end) / 2 / 1440) * 100;
        const isActive = nowMinutes >= start && nowMinutes < end;
        const categoryName = getCategoryName(item);
        const tip = `${item.name}
${timeTextFromMinutes(start)}-${timeTextFromMinutes(end)}`;
        return { item, start, end, midLeft, isActive, tip, categoryName };
      });

      const nextKey = prepared
        .map(({ item, start, end, midLeft, isActive, categoryName }) => `${item.id}:${item.name}:${categoryName}:${start}:${end}:${midLeft.toFixed(2)}:${isActive ? 1 : 0}`)
        .join("|");

      // 일정 구간과 시작/끝 점은 숨기고, 중간 지점에 동그라미 하나만 표시합니다.
      if (nextKey === segmentRenderKey) return;
      segmentRenderKey = nextKey;

      el.segmentLayer.innerHTML = "";
      el.markerLayer.innerHTML = "";

      prepared.forEach(({ midLeft, isActive, tip }) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "eventDot" + (isActive ? " active" : "");
        dot.style.setProperty("--dot-left", `${Math.min(99, Math.max(1, midLeft))}%`);
        dot.setAttribute("aria-label", tip);
        dot.setAttribute("data-tip", tip);
        dot.title = tip;
        el.markerLayer.appendChild(dot);
      });
    }

    function renderGantt() {
      const now = new Date();
      const p = getKstParts(now);
      const events = todayEvents(p);
      const nowMinutes = p.hour * 60 + p.minute + p.second / 60;
      const nowLeft = Math.max(0, Math.min(100, (nowMinutes / 1440) * 100));
      const timeText = `${String(p.hour).padStart(2, "0")}:${String(p.minute).padStart(2, "0")}`;

      el.detailSub.textContent = `오늘은 캠프 ${getCampDay(p)}일차 · ${dayName(p.weekday)}요일 · 현재 ${timeText}`;
      el.ganttSummary.innerHTML = `<span>오늘 등록된 일정 ${events.length}개</span><span>하루 중 ${nowLeft.toFixed(1)}% 진행 중</span>`;
      el.ganttRows.innerHTML = "";

      if (!events.length) {
        el.ganttRows.innerHTML = `<div class="emptyGantt">오늘 표시할 일정이 없어요.</div>`;
        return;
      }

      events.forEach(item => {
        const start = Math.max(0, item.dayStart);
        const end = Math.min(1440, item.dayEnd);
        const left = (start / 1440) * 100;
        const width = Math.max(.7, ((end - start) / 1440) * 100);
        const row = document.createElement("div");
        row.className = "ganttRow";
        const tip = `${item.name}
${timeTextFromMinutes(start)}-${timeTextFromMinutes(end)}`;
        row.innerHTML = `
          <div class="ganttName">
            <b>${escapeHtml(item.name)}</b>
            <span>${timeTextFromMinutes(start)}-${timeTextFromMinutes(end)}</span>
          </div>
          <div class="ganttTrack">
            <span class="ganttNow" style="--now-left:${nowLeft}%"></span>
            <button class="ganttBar" type="button" style="--g-left:${left}%; --g-width:${width}%" title="${escapeHtml(tip)}" data-tip="${escapeHtml(tip)}">
              <span class="ganttBarText">${escapeHtml(item.name)}</span>
            </button>
          </div>
        `;
        el.ganttRows.appendChild(row);

        const bar = row.querySelector(".ganttBar");
        const text = row.querySelector(".ganttBarText");
        // 글씨가 잘릴 것으로 예상되면 차트 안 글씨는 숨기고, hover 툴팁으로만 보여줍니다.
        requestAnimationFrame(() => {
          if (!bar || !text) return;
          const available = Math.max(0, bar.clientWidth - 14);
          if (available < 34 || text.scrollWidth > available) {
            bar.classList.add("narrow");
          }
        });
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function updateBubble(active, now) {
      const messages = [];
      messages.push(active ? `지금은 ${active.name} 시간입니다.` : "지금은 자유 학습 시간입니다.");

      const upcoming = nextImportantEvent(now);
      if (upcoming) {
        messages.push(`${upcoming.item.name}까지 ${remainingText(upcoming.start - now)}!`);
      }

      // 말풍선은 5초마다 자연스럽게 바뀝니다.
      const index = Math.floor(Date.now() / 5000) % messages.length;
      el.nowBubble.textContent = messages[index];
    }

    function nextImportantEvent(now) {
      return items
        .filter(item => ["holiday", "session", "assignment"].includes(item.category))
        .map(item => ({ item, start: eventStartDate(item), end: eventEndDate(item) }))
        .filter(({ start, end }) => start && end && end >= now)
        .sort((a, b) => a.start - b.start)[0];
    }

    function renderCountdowns(now) {
      const upcoming = items
        .filter(item => ["holiday", "session", "assignment"].includes(item.category))
        .map(item => ({ item, start: eventStartDate(item), end: eventEndDate(item) }))
        .filter(({ start, end }) => start && end && end >= now)
        .sort((a, b) => a.start - b.start)
        .slice(0, 4);

      el.countdowns.innerHTML = "";
      if (!upcoming.length) {
        el.countdowns.innerHTML = `<span class="chip">✅ 등록된 공휴일·세션·개인과제가 모두 지났어요</span>`;
        return;
      }

      upcoming.forEach(({ item, start, end }) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        const state = now >= start && now <= end ? "진행 중" : remainingText(start - now);
        chip.innerHTML = `${categoryEmoji[item.category] || "📌"} <strong>${item.name}</strong> ${state}`;
        el.countdowns.appendChild(chip);
      });
    }

    function remainingText(ms) {
      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;
      if (ms <= 0) return "곧 시작";
      if (ms < hour) return `${Math.ceil(ms / minute)}분 남음`;
      if (ms < day) {
        const h = Math.floor(ms / hour);
        const m = Math.floor((ms % hour) / minute);
        return m ? `${h}시간 ${m}분 남음` : `${h}시간 남음`;
      }
      return `${Math.ceil(ms / day)}일 남음`;
    }

    function dayName(n) {
      return ["일", "월", "화", "수", "목", "금", "토"][n];
    }

    function timeTextFromMinutes(value) {
      const safe = Math.max(0, Math.min(1440, Math.round(value)));
      if (safe >= 1440) return "24:00";
      const h = Math.floor(safe / 60);
      const m = safe % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function getCategoryName(item) {
      if (item.category === "other") return item.categoryName || "기타";
      return categoryLabel[item.category] || "기타";
    }

    function describeItem(item) {
      return formatTimeRange(item);
    }

    function renderItemList() {
      const order = { holiday: 0, session: 1, assignment: 2, study: 3, daily: 4, other: 5 };
      const sorted = [...items].sort((a, b) => {
        const ca = order[a.category] ?? 9;
        const cb = order[b.category] ?? 9;
        if (ca !== cb) return ca - cb;
        return describeItem(a).localeCompare(describeItem(b), "ko");
      });

      el.itemList.innerHTML = "";
      sorted.forEach(item => {
        const node = document.createElement("div");
        node.className = "item";
        node.innerHTML = `
          <div>
            <b>${item.name}</b>
            <span>${describeItem(item)}</span>
          </div>
          <div class="itemBtns">
            <button class="miniBtn" data-edit="${item.id}">수정</button>
            <button class="miniBtn del" data-delete="${item.id}">삭제</button>
          </div>
        `;
        el.itemList.appendChild(node);
      });
    }

    function applyAllDayToInputs() {
      if (!el.allDay.checked) return;
      if (el.startDateTime.value) el.startDateTime.value = `${datePart(el.startDateTime.value)}T00:00`;
      if (el.endDateTime.value) el.endDateTime.value = `${datePart(el.endDateTime.value)}T23:59`;
    }


    function getSelectedWeekdays() {
      return [...el.weekdayButtons.querySelectorAll("input:checked")].map(input => Number(input.value));
    }

    function setSelectedWeekdays(days = []) {
      const set = new Set(days.map(Number));
      el.weekdayButtons.querySelectorAll("input").forEach(input => {
        input.checked = set.has(Number(input.value));
      });
    }

    function ensureWeeklyDayDefault() {
      if (el.recurrence.value !== "weekly") return;
      if (getSelectedWeekdays().length) return;
      const baseDay = el.startDateTime.value ? weekdayFromDateValue(el.startDateTime.value) : getKstParts().weekday;
      setSelectedWeekdays([baseDay]);
    }

    function updateRepeatHint() {
      const selected = el.recurrence.value;
      el.weeklyDaysField.classList.toggle("hide", selected !== "weekly");
      if (selected === "daily") {
        el.repeatHint.textContent = "매일 반복됩니다. 시작/종료 시간은 하루 일정에 표시될 시간을 의미해요.";
      } else if (selected === "weekly") {
        ensureWeeklyDayDefault();
        const selectedNames = getSelectedWeekdays().sort((a, b) => a - b).map(dayName).join("·");
        el.repeatHint.textContent = `매주 ${selectedNames || "선택한"}요일마다 반복됩니다. 원하는 요일을 직접 고를 수 있어요.`;
      } else {
        el.repeatHint.textContent = "반복 없이 시작/종료 날짜와 시간으로 한 번만 등록됩니다.";
      }
    }

    function setDefaultDateTimes() {
      const p = getKstParts();
      if (!el.startDateTime.value) el.startDateTime.value = `${p.dateString}T09:00`;
      if (!el.endDateTime.value) el.endDateTime.value = `${p.dateString}T10:00`;
    }

    function clearForm() {
      el.form.reset();
      el.editingId.value = "";
      el.formTitle.textContent = "새 일정 추가";
      el.saveBtn.textContent = "저장하기";
      el.allDay.checked = false;
      el.recurrence.value = "once";
      setSelectedWeekdays([]);
      setDefaultDateTimes();
      updateRepeatHint();
    }

    function fillForm(item) {
      const p = getKstParts();
      el.editingId.value = item.id;
      el.name.value = item.name;
      el.allDay.checked = !!item.allDay;
      el.recurrence.value = item.recurrence || "once";
      setSelectedWeekdays(item.days || []);

      if (item.recurrence === "daily" || item.recurrence === "weekly") {
        const baseDate = item.startDate || p.dateString;
        el.startDateTime.value = `${baseDate}T${item.allDay ? "00:00" : item.start}`;
        el.endDateTime.value = `${baseDate}T${item.allDay ? "23:59" : item.end}`;
      } else {
        el.startDateTime.value = item.startAt || "";
        el.endDateTime.value = item.endAt || "";
      }

      el.formTitle.textContent = "일정 수정";
      el.saveBtn.textContent = "수정 저장";
      updateRepeatHint();
    }

    el.openModal.addEventListener("click", () => {
      renderItemList();
      if (!el.editingId.value) setDefaultDateTimes();
      el.dialog.showModal();
    });

    el.openDetails.addEventListener("click", () => {
      el.detailDialog.showModal();
      renderGantt();
    });

    el.closeDetails.addEventListener("click", () => el.detailDialog.close());
    el.closeModal.addEventListener("click", () => el.dialog.close());
    el.clearForm.addEventListener("click", clearForm);
    el.allDay.addEventListener("change", () => { applyAllDayToInputs(); updateRepeatHint(); });
    el.startDateTime.addEventListener("change", () => { applyAllDayToInputs(); updateRepeatHint(); });
    el.endDateTime.addEventListener("change", applyAllDayToInputs);
    el.recurrence.addEventListener("change", () => { ensureWeeklyDayDefault(); updateRepeatHint(); });
    el.weekdayButtons.addEventListener("change", updateRepeatHint);

    el.resetDefault.addEventListener("click", () => {
      if (!confirm("현재 브라우저에 저장된 일정을 지우고 처음 기본값으로 복구할까요?")) return;
      items = cloneDefaults();
      saveItems();
      clearForm();
      renderItemList();
      render();
    });

    el.form.addEventListener("submit", (e) => {
      e.preventDefault();
      const existing = items.find(saved => saved.id === el.editingId.value);
      const startValue = el.startDateTime.value;
      const endValue = el.endDateTime.value;
      const normalizedStart = el.allDay.checked ? `${datePart(startValue)}T00:00` : startValue;
      const normalizedEnd = el.allDay.checked ? `${datePart(endValue)}T23:59` : endValue;
      const startDate = parseKstDateTime(normalizedStart);
      const endDate = parseKstDateTime(normalizedEnd);

      if (!el.name.value.trim()) return alert("일정 이름을 입력해주세요.");
      if (!startValue || !endValue) return alert("시작 년월일 시간과 종료 년월일 시간을 입력해주세요.");
      if (!startDate || !endDate || startDate >= endDate) return alert("종료 년월일 시간은 시작보다 늦어야 합니다.");
      const repeat = el.recurrence.value;
      const base = {
        id: el.editingId.value || uid(),
        name: el.name.value.trim(),
        category: existing?.category || "other",
        categoryName: "",
        allDay: el.allDay.checked
      };

      let item;
      if (repeat === "daily") {
        item = {
          ...base,
          recurrence: "daily",
          startDate: datePart(normalizedStart),
          start: timePart(normalizedStart),
          end: timePart(normalizedEnd)
        };
      } else if (repeat === "weekly") {
        const selectedDays = getSelectedWeekdays();
        if (!selectedDays.length) return alert("매주 반복할 요일을 하나 이상 선택해주세요.");
        item = {
          ...base,
          recurrence: "weekly",
          startDate: datePart(normalizedStart),
          days: selectedDays.sort((a, b) => a - b),
          start: timePart(normalizedStart),
          end: timePart(normalizedEnd)
        };
      } else {
        item = {
          ...base,
          recurrence: "once",
          startAt: normalizedStart,
          endAt: normalizedEnd
        };
      }

      const idx = items.findIndex(saved => saved.id === item.id);
      if (idx >= 0) items[idx] = item;
      else items.push(item);

      saveItems();
      clearForm();
      renderItemList();
      render();
    });

    el.itemList.addEventListener("click", (e) => {
      const editId = e.target.dataset.edit;
      const deleteId = e.target.dataset.delete;
      if (editId) {
        const item = items.find(x => x.id === editId);
        if (item) fillForm(item);
      }
      if (deleteId) {
        const item = items.find(x => x.id === deleteId);
        if (!item) return;
        if (!confirm(`'${item.name}' 일정을 삭제할까요?`)) return;
        items = items.filter(x => x.id !== deleteId);
        saveItems();
        renderItemList();
        render();
      }
    });

    clearForm();
    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
